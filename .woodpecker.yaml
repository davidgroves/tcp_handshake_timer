# CI: https://ci.codeberg.org/davidgroves/tcp_handshake_timer
# Requires Woodpecker secret: woodpecker_tcp_handshake_timer (Codeberg token with write:repository + package write)

variables:
  - &image ${CI_REPO_OWNER}/tcp_handshake_timer

labels:
  instance: fibrecat

steps:
  test:
    image: golang:bookworm
    commands:
      - ./scripts/ci-deps.sh
      - make test-unit
    when:
      event: [push, pull_request, tag]

  build-check:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: codeberg.org
      repo: *image
      dockerfile: Dockerfile
      dry_run: true
      tags: check
    when:
      event: pull_request

  version:
    image: alpine
    commands:
      - |
        set -eu
        echo "${CI_COMMIT_TAG}" > .version
        echo "VERSION=${CI_COMMIT_TAG}" >> envvars
        printf 'Container image (linux/amd64, linux/arm64):\n\n```\n%s:%s\n```\n\n' \
          "codeberg.org/${CI_REPO_OWNER}/tcp_handshake_timer" "${CI_COMMIT_TAG}" > .release-note
        printf 'Go binaries:\n\n```\nthtimer-%s-linux-amd64\nthtimer-%s-linux-arm64\n```\n\n' \
          "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG}" >> .release-note
        printf 'Source archive:\n\n```\ntcp_handshake_timer-%s.tar.gz\n```\n\n' \
          "${CI_COMMIT_TAG}" >> .release-note
        printf 'SHA256 checksum file is attached to this release.\n' >> .release-note
    when:
      event: tag
      ref: refs/tags/v*

  build-source:
    image: alpine
    commands:
      - apk add --no-cache git
      - |
        set -eu
        mkdir -p dist
        git archive --format=tar.gz --prefix="${CI_REPO_NAME}-${CI_COMMIT_TAG}/" \
          -o "dist/${CI_REPO_NAME}-${CI_COMMIT_TAG}.tar.gz" HEAD
    when:
      event: tag
      ref: refs/tags/v*

  build-binary:
    image: golang:bookworm
    commands:
      - ./scripts/ci-deps.sh
      - chmod +x ./scripts/ci-build-release-binaries.sh
      - ./scripts/ci-build-release-binaries.sh dist
    when:
      event: tag
      ref: refs/tags/v*

  publish-amd64:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: codeberg.org
      repo: ${CI_REPO_OWNER}/tcp_handshake_timer-amd64
      dockerfile: Dockerfile
      tags: ${CI_COMMIT_TAG}
      build_args:
        - TARGETARCH=amd64
      username: ${CI_REPO_OWNER}
      password:
        from_secret: woodpecker_tcp_handshake_timer
    depends_on: [version, test]
    when:
      event: tag
      ref: refs/tags/v*

  publish-arm64:
    image: ghcr.io/osscontainertools/kaniko:v1.25.6
    environment:
      REGISTRY_TOKEN:
        from_secret: woodpecker_tcp_handshake_timer
    commands:
      - chmod +x ./scripts/ci-kaniko-arm64.sh
      - ./scripts/ci-kaniko-arm64.sh tcp_handshake_timer
    depends_on: [version, test]
    when:
      event: tag
      ref: refs/tags/v*

  publish-manifest:
    image: alpine
    environment:
      REGISTRY_TOKEN:
        from_secret: woodpecker_tcp_handshake_timer
    commands:
      - apk add --no-cache curl
      - chmod +x ./scripts/ci-publish-manifest.sh
      - ./scripts/ci-publish-manifest.sh tcp_handshake_timer
    depends_on: [publish-amd64, publish-arm64]
    when:
      event: tag
      ref: refs/tags/v*

  release:
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: woodpecker_tcp_handshake_timer
      title: .version
      note: .release-note
      files:
        - dist/thtimer-*-linux-amd64
        - dist/thtimer-*-linux-arm64
        - dist/tcp_handshake_timer-*.tar.gz
      checksum:
        - sha256
    depends_on: [version, test, build-source, build-binary, publish-manifest]
    when:
      event: tag
      ref: refs/tags/v*
